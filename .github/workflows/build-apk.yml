name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Stack Tower Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Client Dependencies
        run: |
          cd client
          npm install

      - name: 🔨 Build Vite Web Application
        run: |
          cd client
          npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          cd client
          npx cap sync android

      - name: 🤖 Build Android APK with Gradle
        run: |
          cd client/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK Artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: StackTower-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
