name: Build Mobile Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Stack Tower Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Client Dependencies
        run: |
          cd client
          npm install

      - name: 🔨 Build Vite Web Application
        run: |
          cd client
          npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          cd client
          npx cap sync android

      - name: 🤖 Build Android APK with Gradle
        run: |
          cd client/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK Artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: StackTower-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Compile Stack Tower iOS App
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Client Dependencies
        run: |
          cd client
          npm install

      - name: 🔨 Build Vite Web Application
        run: |
          cd client
          npm run build

      - name: 🔄 Copy Web Assets to iOS
        run: |
          cd client
          npx cap copy ios

      - name: 🍎 Build iOS App Package
        run: |
          cd client/ios/App
          pod install --repo-update
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p build/Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app build/Payload/
          cd build
          zip -r StackTower-iOS.ipa Payload

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackTower-iOS-IPA
          path: client/ios/App/build/StackTower-iOS.ipa
          if-no-files-found: warn
          retention-days: 30

